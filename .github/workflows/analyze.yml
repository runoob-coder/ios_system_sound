name: Analyze

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: analyze-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print versions
        run: flutter --version

      - name: Get plugin dependencies
        run: flutter pub get

      - name: Flutter analyze (plugin)
        run: flutter analyze

      - name: Get example dependencies
        working-directory: example
        run: flutter pub get

      - name: Flutter analyze (example)
        working-directory: example
        run: flutter analyze
